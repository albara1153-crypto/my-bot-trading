<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التداول الاحترافية</title>
    <style>
        body { background: #0b0e11; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        .header-top { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .balance-card { padding: 20px; background: #1e2329; border-radius: 12px; margin: 10px; }
        .balance-val { font-size: 28px; font-weight: bold; margin: 10px 0; }
        .grid-icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; text-align: center; }
        .icon-box { font-size: 12px; }
        .icon-circle { background: #2b313a; width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-size: 20px; }
        
        /* الشريط السفلي */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #1e2329; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #2b313a; }
        .nav-item { text-align: center; font-size: 11px; color: #848e9c; }
        .nav-item.active { color: #f3ba2f; }
        
        .main-content { padding: 10px; }
        .card { background: #1e2329; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header-top">
        <div style="font-size: 18px; font-weight: bold;">منصة التداول</div>
        <div>🔍</div>
    </div>

    <div class="balance-card">
        <div>القيمة الإجمالية (SAR)</div>
        <div class="balance-val">0,00330199 ر.س</div>
    </div>

    <div class="grid-icons">
        <div class="icon-box"><div class="icon-circle">👤</div>الإحالة</div>
        <div class="icon-box"><div class="icon-circle">💎</div>Sharia Earn</div>
        <div class="icon-box"><div class="icon-circle">💰</div>Earn</div>
        <div class="icon-box"><div class="icon-circle">🔄</div>تحويل</div>
    </div>

    <div class="main-content">
        <div class="card">
            <div id="tradingview_chart" style="height: 250px;"></div>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <div class="bottom-nav">
        <div class="nav-item active">🏠<br>الرئيسية</div>
        <div class="nav-item">📊<br>الأسواق</div>
        <div class="nav-item">⚡<br>تداول</div>
        <div class="nav-item">💼<br>الأصول</div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        new TradingView.widget({"width": "100%", "height": "250", "symbol": "BITSTAMP:BTCUSD", "theme": "dark", "container_id": "tradingview_chart"});
    </script>
</body>
</html>
